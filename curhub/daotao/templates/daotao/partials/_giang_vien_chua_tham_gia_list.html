{% load custom_filters %}
<div class="list-group">
    {% for gv in giang_vien_chua_tham_gia %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <i class="fas fa-user-graduate mr-2"></i>
            {{ gv.ho_ten }} ({{ gv.ma_can_bo }})
        </div>
        {% if is_draft %}
        <button class="btn btn-sm btn-success btn-add-gv" data-gv-pk="{{ gv.pk }}" data-gv-name="{{ gv.ho_ten }}">
            <i class="fas fa-user-plus"></i> Thêm
        </button>
        {% endif %}
    </div>
    {% empty %}
    <div class="list-group-item text-muted">
        Không có giảng viên nào để hiển thị
    </div>
    {% endfor %}
</div>
