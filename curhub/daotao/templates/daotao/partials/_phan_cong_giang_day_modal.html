<form id="phanCongForm">
    {% csrf_token %}
    <input type="hidden" name="giang_vien_pk" value="{{ giang_vien.pk }}">
    <div class="table-responsive" style="max-height: 400px;">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Chọn</th>
                    <th>Học phần</th>
                    <th>Vai trò</th>
                </tr>
            </thead>
            <tbody>
                {% for hp_ctdt in hoc_phan_list %}
                <tr>
                    <td>
                        <input type="checkbox" name="hoc_phan" value="{{ hp_ctdt.pk }}"
                            {% if hp_ctdt.pk in current_assignments %}checked{% endif %}>
                    </td>
                    <td>{{ hp_ctdt.hoc_phan.ten_hoc_phan }}</td>
                    <td>
                        <select name="vai_tro_{{ hp_ctdt.pk }}" class="form-control">
                            {% for value, display in vai_tro_choices %}
                            <option value="{{ value }}"
                                {% if current_assignments|get_item:hp_ctdt.pk == value %}selected{% endif %}>
                                {{ display }}
                            </option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">Không có học phần nào trong chương trình đào tạo.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</form>
