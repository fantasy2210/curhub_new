{% load static %}
<div class="row">
    <div class="col-md-6">
        <h5>Giảng viên chưa tham gia</h5>
        <div class="card">
            <div class="card-body">
                <input type="text" id="giangvien-search-available" class="form-control mb-3" placeholder="Tìm kiếm giảng viên...">
                <div id="available-lecturers" class="list-group" style="height: 400px; overflow-y: auto;">
                    <!-- AJAX content will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <h5>Giảng viên đã tham gia</h5>
        <div class="card">
            <div class="card-body">
                <input type="text" id="giangvien-search-assigned" class="form-control mb-3" placeholder="Tìm kiếm trong danh sách đã chọn...">
                <div id="assigned-lecturers" class="list-group" style="height: 400px; overflow-y: auto;">
                    <!-- AJAX content will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>
